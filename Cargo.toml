[package]
name = "stopit"
version = "0.1.0"
edition = "2024"
rust-version = "1.85"
default-run = "stopit"
description = "A Linux sandbox tool"

[lib]
path = "src/lib.rs"

[[bin]]
name = "stopit"
path = "src/main.rs"

# Test-only: observes what a sandboxed process can see and do (tests/probe.rs).
[[bin]]
name = "stopit-probe"
path = "src/bin/stopit-probe/main.rs"

[lints.rust]
unsafe_op_in_unsafe_fn = "deny"

[lints.clippy]
all = { level = "warn", priority = -1 }

[dependencies]
globset = "0.4.19"
# `execve`, `close_range`, `prctl` and the signal state `__init` resets before
# `execve`, none of which rustix offers outside its unstable `runtime` module.
libc = "0.2.191"
# `system` is used only by stopit-probe (uname), which shares this package.
rustix = { version = "1.1.5", features = ["fs", "process", "system"] }
serde = { version = "1.0.229", features = ["derive"] }
serde_json = "1.0.154"
thiserror = "2.0.21"
toml = "1.1.8"
walkdir = "2.5.0"

[dev-dependencies]
tempfile = "3.27.0"
